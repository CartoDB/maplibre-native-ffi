# Opt in with `mise -E msys2` on Windows after installing MSYS2's MINGW64
# clang and llvm packages. Project tasks still run in Git Bash.
[vars]
host_native_preset = "mingw-x64-wgl"

[env]
# This toolchain uses no Visual Studio environment.
BASH_ENV = ""
MLN_FFI_MSYS2_ROOT = "{{ env.MLN_FFI_MSYS2_ROOT | default(value='C:/msys64/mingw64') }}"
_.path = [
  "{{ env.MLN_FFI_MSYS2_ROOT | default(value='C:/msys64/mingw64') }}/bin",
]
